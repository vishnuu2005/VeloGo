spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/velogodb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:velogo_user}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  razorpay:
    simulate-mode: ${PAYMENT_SIMULATE_MODE:false}

logging:
  level:
    com.velogo: INFO
    org.springframework.security: WARN
