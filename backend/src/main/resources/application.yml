server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: velogo-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"
      - "http://localhost:80"
      - "http://localhost"
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_velogo123456}
    key-secret: ${RAZORPAY_KEY_SECRET:velogo_secret_test_key}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:velogo_webhook_secret}
    simulate-mode: ${PAYMENT_SIMULATE_MODE:true}
  dispatch:
    matching-radius-km: 15.0
    request-timeout-seconds: 45
    max-retry-attempts: 3
  routing:
    osrm-url: ${OSRM_URL:https://router.project-osrm.org}
    use-fallback-haversine: true
  geocoding:
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
